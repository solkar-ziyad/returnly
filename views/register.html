<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Returnly | Register</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container navbar">
        <a href="/" class="brand" aria-label="Returnly home">
          <span class="brand-mark">R</span>
          <span>Returnly</span>
        </a>
        <nav class="nav-links" aria-label="Main navigation">
          <a href="/browse">Browse</a>
          <a href="/login">Login</a>
          <a href="/register" class="nav-action primary">Join</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="container">
          <div class="form-shell">
            <div class="form-header">
              <span class="eyebrow">Create account</span>
              <h2>Join the Returnly community</h2>
            </div>
            <form method="post" action="/register" class="form-row">
              <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" value="{{name}}" placeholder="Your full name" />
                <div class="form-error">{{nameError}}</div>
              </div>
              <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" value="{{email}}" placeholder="name@example.com" />
                <div class="form-error">{{emailError}}</div>
              </div>
              <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Choose a password" />
                <div class="form-error">{{passwordError}}</div>
              </div>
              <button type="submit" class="btn btn-primary">Create account</button>
              <p>Already have an account? <a href="/login" class="inline-link">Log in</a></p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <span>© 2026 Returnly</span>
        <span>Lost &amp; Found for public spaces</span>
      </div>
    </footer>
  </body>
</html>
